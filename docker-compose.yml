services:
  db:
    image: postgres:15-alpine
    container_name: traffic_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: traffic_sim_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  motor-simulacion:
    build: ./motor-simulacion
    container_name: traffic_motor
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./motor-simulacion/.env

  backend:
    build: ./backend
    container_name: traffic_backend
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - motor-simulacion

  frontend:
    build: ./frontend
    container_name: traffic_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
